<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerOpsMonitor</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .header-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtitle {
            margin: 0;
            color: #94a3b8;
            font-size: 15px;
        }

        .menu-card {
            background: #0f172a;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }

        .menu-link {
            display: block;
            text-decoration: none;
            background: #1e293b;
            color: #e2e8f0;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .menu-link:hover {
            background: #111827;
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .menu-link.primary {
            background: #2563eb;
            border-color: #3b82f6;
            color: white;
        }

        .menu-link.primary:hover {
            background: #1d4ed8;
        }

        .menu-link.github {
            color: #cbd5e1;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
                padding: 16px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>ServerOpsMonitor</h1>
            <p class="subtitle">Server management and monitoring dashboard</p>
        </div>

        <nav class="menu-card">
            <h2>Choose an action</h2>
            <ul class="menu-list">
                <li><a href="/servers" class="menu-link primary">Servers</a></li>
                <li><a href="/checkurl" class="menu-link">URL Checker</a></li>
                <li><a href="/ip" class="menu-link">IP Checker</a></li>
                <li><a href="/admin" class="menu-link">Admin Panel</a></li>
                <li><a href="https://github.com/KlyaksaOFF" class="menu-link github">My GitHub</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
