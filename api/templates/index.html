<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerOpsMonitor</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .header-card,
        .menu-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        .header-card {
            padding: 28px;
            margin-bottom: 24px;
        }

        .menu-card {
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtitle {
            margin: 0;
            color: #94a3b8;
            font-size: 15px;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 600;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }

        .menu-link {
            display: block;
            text-decoration: none;
            color: white;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
        }

        .menu-link:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .servers {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        .url {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .ip {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
        }

        .admin {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        .github {
            background: linear-gradient(135deg, #334155, #64748b);
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
                padding: 16px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>ServerOpsMonitor</h1>
            <p class="subtitle">Server management and monitoring dashboard</p>
        </div>

        <nav class="menu-card">
            <h2>Choose an action</h2>
            <ul class="menu-list">
                <li><a href="/servers" class="menu-link servers">Servers</a></li>
                <li><a href="/terminal" class="menu-link servers">WebTerminal</a></li>
                <li><a href="/checkurl" class="menu-link url">URL Checker</a></li>
                <li><a href="/ip" class="menu-link ip">IP Checker</a></li>
                <li><a href="/admin" class="menu-link admin">Admin Panel</a></li>
                <li><a href="https://github.com/KlyaksaOFF" class="menu-link github">My GitHub</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
