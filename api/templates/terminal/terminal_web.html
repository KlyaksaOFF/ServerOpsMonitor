<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .header-card,
        .terminal-card,
        .command-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        .header-card {
            padding: 24px;
            margin-bottom: 20px;
        }

        .header-card h1 {
            margin: 0;
            color: #f8fafc;
        }

        .terminal-card {
            padding: 20px;
            margin-bottom: 20px;
        }

        .terminal-window {
            height: 500px;
            overflow-y: auto;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .command-card {
            padding: 20px;
        }

        .command-form {
            display: flex;
            gap: 12px;
        }

        .command-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
        }

        .command-input:focus {
            border-color: #38bdf8;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .command-line {
            color: #38bdf8;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header-card">
        <h1>Terminal</h1>
    </div>

    <div class="terminal-card">
        <div class="terminal-window">

<span class="command-line">root@server:~# uptime</span>

 15:04:11 up 12 days, 7 hours, 2 users, load average: 0.02, 0.03, 0.01

<span class="command-line">root@server:~# free -h</span>

               total        used        free
Mem:           2.0Gi       700Mi       1.1Gi

<span class="command-line">root@server:~#</span>

        </div>
    </div>

    <div class="command-card">
        <form class="command-form" method="post">
            <input
                class="command-input"
                type="text"
                name="command"
                placeholder="Enter command..."
                autocomplete="off"
            >

            <button class="btn" type="submit">
                Execute
            </button>
        </form>
    </div>

</div>

</body>
</html>
