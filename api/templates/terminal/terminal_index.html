<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal connector</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        .container {
            max-width: 520px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
            color: #f8fafc;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Terminal connector</h1>

        <form method="post" action="/terminal/connect">
            <div class="form-group">
                <label for="ip">IP:</label>
                <input id="ip" name="ip" type="text" placeholder="192.192.192.22" required>
            </div>

            <div class="form-group">
                <label for="user">User:</label>
                <input id="user" name="user" type="text" placeholder="root" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button class="btn" type="submit">Connect</button>
        </form>
    </div>
</div>

</body>
</html>
